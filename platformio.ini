; PlatformIO 配置（与 Arduino IDE 二选一，首选 Arduino IDE 2.x 直接打开 Ollie.ino）
; 源码目录指到仓库根（与 .ino 同级），并排除构建/文档目录
[platformio]
src_dir = .
; 只有一个环境，省略 default_envs，PlatformIO 自动构建 [env:olllie]

[env:olllie]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
board_build.arduino.memory_type = qio_opi ; N16R8：四线 Flash + 八线 PSRAM
board_upload.flash_size = 16MB
src_filter = +<*> -<.pio/> -<docs/>
build_flags =
    -DCORE_DEBUG_LEVEL=1
lib_deps =
    adafruit/Adafruit SSD1306 @ ^2.5.0
    adafruit/Adafruit GFX Library @ ^1.11.9
